pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        // Match root ext.kotlin_version (2.2.10). Needed so Room generates
        // AppDatabase_Impl for Kotlin Profile/AppDatabase (annotationProcessor alone does not).
        id 'com.google.devtools.ksp' version '2.2.10-2.0.2'
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

include ':app'
include ':libraries:AttributionPresenter:library'
include ':libraries:simple-gauge-android:gaugelibrary'
