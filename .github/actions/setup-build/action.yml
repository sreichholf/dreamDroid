name: Set up the Gradle build
description: JDK 25, Android SDK packages, Gradle with caches, and the Maven Central mirror. Run after checkout.
inputs:
  gradle-cache-read-only:
    description: Passed to setup-gradle's cache-read-only.
    required: false
    # setup-gradle's own default.
    default: ${{ github.event.repository != null && github.ref_name != github.event.repository.default_branch }}
runs:
  using: composite
  steps:
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: "25"
        distribution: temurin

    # ubuntu-latest already ships Android SDK + ANDROID_HOME. Do not use
    # setup-android (re-downloads cmdline-tools / emulator). Preinstall the
    # platform AGP still auto-fetches mid-build (33) so it cannot create
    # $ANDROID_HOME/.temp/PackageOperation* entries that poison Gradle's
    # configuration-cache fingerprints across runners.
    - name: Ensure Android SDK platforms
      uses: ./.github/actions/ensure-android-sdk

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        # Open-source cache provider (v6 default pulls proprietary gradle-actions-caching).
        cache-provider: basic
        cache-read-only: ${{ inputs.gradle-cache-read-only }}

    # Sonatype rate-limits Maven Central per egress IP (429s on shared
    # runners). After setup-gradle so its cache restore cannot drop it.
    - name: Resolve Maven Central through Google's mirror
      shell: bash
      run: install -D -m 644 scripts/gradle/maven-central-mirror.init.gradle.kts ~/.gradle/init.d/maven-central-mirror.init.gradle.kts

    - name: Make gradlew executable
      shell: bash
      run: chmod +x gradlew

    # setup-gradle's basic provider keys on the build files and never
    # overwrites an existing key, so its copy of the build cache freezes at
    # the last build-file change. This rolling key carries main's latest
    # task outputs (saved by the unit job). After setup-gradle so the newer
    # copy wins.
    - name: Restore Gradle build cache
      uses: actions/cache/restore@v5
      with:
        path: ~/.gradle/caches/build-cache-1
        key: gradle-build-cache-${{ github.sha }}
        restore-keys: gradle-build-cache-
