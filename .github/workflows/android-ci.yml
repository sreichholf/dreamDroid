name: Android CI

on:
  push:
    branches: [main]
  # No `edited`: a title/body edit would start a run of skipped jobs, the newest
  # run on the commit, and the required checks would read it instead of the
  # real one. A PR retargeted onto main gets CI from its next push.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Build and upload arm64 googleDebug APK artifact
        type: boolean
        default: false
      upgrade_from_115:
        description: Upgrade a real v1.15.460 install to this build on an emulator, instead of the instrumented suite
        type: boolean
        default: false

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# One emulator for androidTest and upgrade115; the AVD snapshot cache key is
# derived from these, so both jobs share one cached, booted AVD.
# aosp_atd: Automated Test Device image (no Play/Google APIs, fewer system
# apps, headless). No test needs Google APIs.
env:
  AVD_API_LEVEL: 30
  AVD_TARGET: aosp_atd
  # Pixel 7: in landscape expanded wide (~914dp) but compact tall (~411dp), like current
  # phones; EpgDetailLandscapeTest needs that window. Pixel 4 (~829dp) is only medium wide.
  AVD_PROFILE: pixel_7
  # Part of the AVD cache key. Bump it whenever the snapshot step or
  # .github/emulator/settle-snapshot.sh changes, so the old snapshot is not reused.
  AVD_SNAPSHOT_VERSION: v2

jobs:
  unit:
    name: Unit tests + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Same-repo PRs may write caches; forks stay read-only.
      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # --no-configuration-cache: restoring a project config-cache across GHA
      # runners cost ~26m validating an entry that then invalidated on an SDK
      # .temp path; dependency/build caches already make the real work ~30s.
      # The check list lives in the prTests task in app/build.gradle.kts.
      # androidTest compile catches broken Compose tests without an emulator.
      # Phone-installable arm64 APK: main pushes, PRs (device smoke without a
      # local build), or workflow_dispatch with upload_apk. -Parm64Apk builds
      # one ABI split (~57MB); splits only affect packaging, not the checks.
      - name: Unit tests (prTests) + arm64 APK
        env:
          ASSEMBLE: ${{ github.event_name != 'workflow_dispatch' || inputs.upload_apk }}
        run: |
          tasks=(:app:prTests)
          [[ "$ASSEMBLE" == true ]] && tasks+=(:app:assembleGoogleDebug)
          ./gradlew --no-configuration-cache -Parm64Apk "${tasks[@]}"

      # Only main saves: a PR's entry is visible to that PR alone and would
      # count against the repo's 10 GB cache quota.
      - name: Save Gradle build cache
        if: github.event_name == 'push'
        uses: actions/cache/save@v5
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-build-cache-${{ github.sha }}

      - name: Upload googleDebug arm64 APK
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_apk)
        uses: actions/upload-artifact@v6
        with:
          name: dreamdroid-google-debug-apk
          path: app/build/outputs/apk/google/debug/app-google-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 2

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testGoogleDebugUnitTest/
            app/build/test-results/testGoogleDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  # Runs beside the unit job so lint does not compete with tests and dexing
  # for the runner's 4 vCPUs. Not on main pushes: the merged PR already ran it.
  lint:
    name: Lint + spotless
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up build
        uses: ./.github/actions/setup-build
        with:
          gradle-cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # spotlessCheck: ktlint android_studio (Google Android Kotlin) on the Kotlin source roots (app/src, app/test, app/androidTest).
      # Lint errors fail the build (abortOnError); warnings are reported only.
      # -Parm64Apk as in the unit job: the main compile's cache key depends on it.
      - name: Lint + spotless (prLint)
        run: ./gradlew --no-configuration-cache -Parm64Apk :app:prLint

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: lint-report
          path: app/build/reports/lint-results-googleDebug.html
          if-no-files-found: ignore
          retention-days: 14

  # Emulator jobs are free on this public repo but slow and flaky.
  # Keep them off pull_request; run on main pushes and manual workflow_dispatch.
  # Three runners each build the APKs and run a third of the suite
  # (AndroidJUnitRunner numShards/shardIndex) on the cached AVD.
  androidTest:
    name: Instrumented Compose tests (shard ${{ matrix.shard }}/3)
    if: github.event_name != 'pull_request' && !inputs.upgrade_from_115
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      SHARD_ARGS: -PtestShardCount=3 -PtestShardIndex=${{ matrix.shard }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up build
        uses: ./.github/actions/setup-build

      # Build before the emulator boots so it does not compete for the runner's CPUs.
      # -Pci disables ABI splits so connectedAndroidTest installs one APK.
      - name: Build googleDebug + androidTest APKs
        run: ./gradlew -Pci --no-configuration-cache :app:assembleGoogleDebug :app:assembleGoogleDebugAndroidTest

      # Boot from a cached AVD snapshot instead of cold booting
      # (reactivecircus/android-emulator-runner README, "Caching AVD").
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_PROFILE }}-${{ env.AVD_SNAPSHOT_VERSION }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          arch: x86_64
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/emulator/settle-snapshot.sh

      - name: Instrumented tests (googleDebug)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          arch: x86_64
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          # Boot from the cached snapshot; do not write it back.
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # Cloud `connected-test.sh` instead streams the ABI-split x86_64 APK
          # (UTP's fat-APK push times out under TCG). Do not unify those paths.
          # Do not pass -Pandroid.testInstrumentationRunnerArguments… (breaks flavors);
          # app/build.gradle.kts maps testShardCount/testShardIndex to `am instrument`
          # arguments only, so the APKs built above without SHARD_ARGS are reused as is.
          # Wait for the package manager first: a snapshot restore reports
          # boot_completed before the framework is up.
          script: |
            adb wait-for-device
            timeout 60 bash -c 'until adb shell pm path android | grep -q package:; do sleep 2; done'
            ./gradlew -Pci --no-configuration-cache $SHARD_ARGS :app:connectedGoogleDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: androidTest-reports-shard-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  # Release check: 1.15 → 2.0 over live app data. Both debug builds share
  # debug.keystore and net.reichholf.dreamdroid.debug, so `adb install -r` is a
  # real in-place upgrade. See .github/upgrade-from-115/run.sh.
  build115:
    name: Build 1.15 googleDebug (v1.15.460)
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_from_115
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The last published 1.x release (GitHub, Play, F-Droid).
      - name: Checkout v1.15.460
        uses: actions/checkout@v5
        with:
          ref: v1.15.460

      # AGP 8.1 / Gradle 8.0 need JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # v1.15.460 predates the mirror init script; take it from this commit.
      - name: Checkout Maven Central mirror init script
        uses: actions/checkout@v5
        with:
          path: ci-scripts
          sparse-checkout: scripts/gradle

      - name: Resolve Maven Central through Google's mirror
        run: install -D -m 644 ci-scripts/scripts/gradle/maven-central-mirror.init.gradle.kts ~/.gradle/init.d/maven-central-mirror.init.gradle.kts

      # 1.15 has no signingConfigs; inject the repo debug.keystore main signs
      # with (copying it to ~/.android did not take on the runner). JCenter is
      # gone: org.openhab.jmdns 3.4.2 only lived there, javax.jmdns 3.4.1 on
      # Maven Central has the same API.
      # gradle.properties jvmargs carry CMS flags JDK 17 rejects.
      - name: Assemble 1.15 googleDebug
        run: |
          set -euo pipefail
          sed -i \
            -e 's/org.openhab.jmdns:jmdns:3.4.2/javax.jmdns:jmdns:3.4.1/' \
            -e 's/jcenter()/mavenCentral()/' \
            app/build.gradle
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx3g --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED" \
            -Pandroid.injected.signing.store.file="$PWD/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android \
            :app:assembleGoogleDebug

      - name: Upload 1.15 x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: dreamdroid-115-x86_64-apk
          path: app/build/outputs/apk/google/debug/app-google-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 2

  upgrade115:
    name: Upgrade 1.15 → 2.0 on emulator
    needs: build115
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up build
        uses: ./.github/actions/setup-build

      # ABI splits on (no -Pci): the x86_64 split's versionCode (9×10⁷ + base)
      # must beat 1.15's x86_64 split, as on Play.
      - name: Assemble 2.0 googleDebug + androidTest
        run: ./gradlew --no-configuration-cache :app:assembleGoogleDebug :app:assembleGoogleDebugAndroidTest

      - name: Download 1.15 APK
        uses: actions/download-artifact@v7
        with:
          name: dreamdroid-115-x86_64-apk
          path: old

      # Fail before booting the emulator if install -r would be rejected.
      - name: Check both APKs share a signer
        run: |
          set -euo pipefail
          signer() {
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$1" | grep 'certificate SHA-256'
          }
          old=$(signer old/app-google-x86_64-debug.apk)
          new=$(signer app/build/outputs/apk/google/debug/app-google-x86_64-debug.apk)
          echo "1.15: $old"
          echo "2.0:  $new"
          [[ "$old" == "$new" ]]

      # Boot from a cached AVD snapshot instead of cold booting
      # (reactivecircus/android-emulator-runner README, "Caching AVD").
      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_PROFILE }}-${{ env.AVD_SNAPSHOT_VERSION }}

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          arch: x86_64
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: bash .github/emulator/settle-snapshot.sh

      - name: Upgrade on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          arch: x86_64
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/upgrade-from-115/run.sh old/app-google-x86_64-debug.apk app/build/outputs/apk/google/debug/app-google-x86_64-debug.apk app/build/outputs/apk/androidTest/google/debug/app-google-debug-androidTest.apk upgrade-logs

      - name: Upload upgrade logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-115-logs
          path: upgrade-logs/
          if-no-files-found: ignore
          retention-days: 14
