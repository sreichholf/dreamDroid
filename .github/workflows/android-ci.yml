name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # Unit job does not need the emulator package (setup-android installs it by default).
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Same-repo PRs may write caches; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      # Configuration cache lives under the project tree, not ~/.gradle — cache it
      # explicitly so PR/main runs can skip the ~10–15 min cold configure.
      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: gradle-config-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-config-cache-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      # One Gradle invocation keeps the daemon warm (do not pass --no-daemon with setup-gradle).
      # -Pci disables ABI splits so we assemble one APK (libvlc natives × 5 was wasteful on PRs).
      # Compiling androidTest catches broken Compose tests without an emulator.
      - name: Unit tests + assemble + compile androidTest
        run: >
          ./gradlew -Pci
          :app:testGoogleDebugUnitTest
          :app:assembleGoogleDebug
          :app:compileGoogleDebugAndroidTestKotlin
          :app:compileGoogleDebugAndroidTestJavaWithJavac

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testGoogleDebugUnitTest/
            app/build/test-results/testGoogleDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  # Emulator jobs are free on this public repo but slow (~20–40+ min) and flaky.
  # Keep them off pull_request; run on main pushes and manual workflow_dispatch.
  androidTest:
    name: Instrumented Compose tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Gradle configuration cache
        uses: actions/cache@v4
        with:
          path: .gradle/configuration-cache
          key: gradle-config-cache-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-config-cache-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Instrumented tests (googleDebug)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          # -Pci disables ABI splits so connectedAndroidTest installs one APK.
          # Do not pass -Pandroid.testInstrumentationRunnerArguments… (breaks flavors).
          script: ./gradlew -Pci :app:connectedGoogleDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
