name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Default types (opened/synchronize/reopened) miss PR base retargets.
    # edited covers that; title/body-only edits are skipped in the job `if`.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      upload_apk:
        description: Build and upload arm64 googleDebug APK artifact
        type: boolean
        default: false
      upgrade_from_115:
        description: Upgrade a real 1.15 (master) install to this build on an emulator, instead of the instrumented suite
        type: boolean
        default: false

concurrency:
  # Isolate title/body-only edited runs so they do not cancel a real CI run.
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event.action == 'edited' && github.event.changes.base.ref.from == '' && '-pr-text' || '' }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + assemble
    if: github.event.action != 'edited' || github.event.changes.base.ref.from != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      # ubuntu-latest already ships Android SDK + ANDROID_HOME. Do not use
      # setup-android (re-downloads cmdline-tools / emulator). Preinstall the
      # platform AGP still auto-fetches mid-build (33) so it cannot create
      # $ANDROID_HOME/.temp/PackageOperation* entries that poison Gradle's
      # configuration-cache fingerprints across runners.
      - name: Ensure Android SDK platforms
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "ANDROID_HOME/SDK root missing" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          # Image has 34+; AGP still auto-fetches platform 33 mid-build and leaves
          # $SDK/.temp/PackageOperation* fingerprints that poison config-cache.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "platforms;android-34" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
          rm -rf "$SDK/.temp"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache provider (v6 default pulls proprietary gradle-actions-caching).
          cache-provider: basic
          # Same-repo PRs may write caches; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --no-configuration-cache: restoring a project config-cache across GHA
      # runners cost ~26m validating an entry that then invalidated on an SDK
      # .temp path; dependency/build caches already make the real work ~30s.
      # -Pci disables ABI splits (one APK). androidTest compile catches broken
      # Compose tests without an emulator.
      # spotlessCheck: ktlint android_studio (Google Android Kotlin) on the Kotlin source roots (app/src, app/test, app/androidTest).
      - name: Unit tests + compile androidTest
        run: >
          ./gradlew -Pci --no-configuration-cache
          spotlessCheck
          :app:testGoogleDebugUnitTest
          :app:compileGoogleDebugAndroidTestKotlin
          :app:compileGoogleDebugAndroidTestJavaWithJavac

      # Lint errors fail the build (abortOnError); warnings are reported only.
      - name: Lint googleDebug
        run: ./gradlew -Pci --no-configuration-cache :app:lintGoogleDebug

      # Phone-installable arm64 APK: main pushes, PRs (so Cloud/device smoke
      # without local emulator), or workflow_dispatch with upload_apk=true.
      # -Parm64Apk builds one ABI split (~57MB), not fat -Pci.
      - name: Assemble googleDebug arm64 APK
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_apk)
        run: >
          ./gradlew --no-configuration-cache -Parm64Apk
          :app:assembleGoogleDebug

      - name: Upload googleDebug arm64 APK
        if: >-
          github.event_name == 'push' ||
          github.event_name == 'pull_request' ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_apk)
        uses: actions/upload-artifact@v6
        with:
          name: dreamdroid-google-debug-apk
          path: app/build/outputs/apk/google/debug/app-google-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 2

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testGoogleDebugUnitTest/
            app/build/test-results/testGoogleDebugUnitTest/
            app/build/reports/lint-results-googleDebug.html
          if-no-files-found: ignore
          retention-days: 14

  # Emulator jobs are free on this public repo but slow (~20–40+ min) and flaky.
  # Keep them off pull_request; run on main pushes and manual workflow_dispatch.
  androidTest:
    name: Instrumented Compose tests
    if: github.event_name != 'pull_request' && !inputs.upgrade_from_115
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Ensure Android SDK platforms
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "ANDROID_HOME/SDK root missing" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          # Image has 34+; AGP still auto-fetches platform 33 mid-build and leaves
          # $SDK/.temp/PackageOperation* fingerprints that poison config-cache.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "platforms;android-34" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
          rm -rf "$SDK/.temp"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Instrumented tests (googleDebug)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          # -Pci disables ABI splits so connectedAndroidTest installs one APK.
          # Cloud `connected-test.sh` instead streams the ABI-split x86_64 APK
          # (UTP's fat-APK push times out under TCG). Do not unify those paths.
          # Do not pass -Pandroid.testInstrumentationRunnerArguments… (breaks flavors).
          script: ./gradlew -Pci --no-configuration-cache :app:connectedGoogleDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14

  # E2 release check: 1.15 → 2.0 over live app data. Both debug builds share
  # debug.keystore and net.reichholf.dreamdroid.debug, so `adb install -r` is a
  # real in-place upgrade. See .github/upgrade-from-115/run.sh.
  build115:
    name: Build 1.15 googleDebug (master)
    if: github.event_name == 'workflow_dispatch' && inputs.upgrade_from_115
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      # AGP 8.2 / Gradle 8.2 need JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      # master signs with AGP's default ~/.android/debug.keystore; use the repo
      # copy main signs with. JCenter is gone: org.openhab.jmdns 3.4.2 only
      # lived there, javax.jmdns 3.4.1 on Maven Central has the same API.
      # gradle.properties jvmargs carry CMS flags JDK 17 rejects.
      - name: Assemble 1.15 googleDebug
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          sed -i \
            -e 's/org.openhab.jmdns:jmdns:3.4.2/javax.jmdns:jmdns:3.4.1/' \
            -e 's/jcenter()/mavenCentral()/' \
            app/build.gradle
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache \
            "-Dorg.gradle.jvmargs=-Xmx3g --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED" \
            :app:assembleGoogleDebug

      - name: Upload 1.15 x86_64 APK
        uses: actions/upload-artifact@v6
        with:
          name: dreamdroid-115-x86_64-apk
          path: app/build/outputs/apk/google/debug/app-google-x86_64-debug.apk
          if-no-files-found: error
          retention-days: 2

  upgrade115:
    name: Upgrade 1.15 → 2.0 on emulator
    needs: build115
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Ensure Android SDK platforms
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "platforms;android-34" "platforms;android-36" "platforms;android-37.0" "build-tools;36.0.0"
          rm -rf "$SDK/.temp"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # ABI splits on (no -Pci): the x86_64 split's versionCode (9×10⁷ + base)
      # must beat 1.15's x86_64 split, as on Play.
      - name: Assemble 2.0 googleDebug + androidTest
        run: |
          chmod +x gradlew
          ./gradlew --no-configuration-cache :app:assembleGoogleDebug :app:assembleGoogleDebugAndroidTest

      - name: Download 1.15 APK
        uses: actions/download-artifact@v7
        with:
          name: dreamdroid-115-x86_64-apk
          path: old

      - name: Upgrade on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          script: bash .github/upgrade-from-115/run.sh old/app-google-x86_64-debug.apk app/build/outputs/apk/google/debug/app-google-x86_64-debug.apk app/build/outputs/apk/androidTest/google/debug/app-google-debug-androidTest.apk upgrade-logs

      - name: Upload upgrade logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: upgrade-115-logs
          path: upgrade-logs/
          if-no-files-found: ignore
          retention-days: 14
