name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests + assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      # ubuntu-latest already ships Android SDK + ANDROID_HOME. Do not use
      # setup-android (re-downloads cmdline-tools / emulator). Preinstall the
      # platform AGP still auto-fetches mid-build (33) so it cannot create
      # $ANDROID_HOME/.temp/PackageOperation* entries that poison Gradle's
      # configuration-cache fingerprints across runners.
      - name: Ensure Android SDK platforms
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "ANDROID_HOME/SDK root missing" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          # Image has 34+; AGP still auto-fetches platform 33 mid-build and leaves
          # $SDK/.temp/PackageOperation* fingerprints that poison config-cache.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "platforms;android-34" "build-tools;36.0.0"
          rm -rf "$SDK/.temp"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache provider (v6 default pulls proprietary gradle-actions-caching).
          cache-provider: basic
          # Same-repo PRs may write caches; forks stay read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # --no-configuration-cache: restoring a project config-cache across GHA
      # runners cost ~26m validating an entry that then invalidated on an SDK
      # .temp path; dependency/build caches already make the real work ~30s.
      # -Pci disables ABI splits (one APK). androidTest compile catches broken
      # Compose tests without an emulator.
      - name: Unit tests + compile androidTest
        run: >
          ./gradlew -Pci --no-configuration-cache
          :app:testGoogleDebugUnitTest
          :app:compileGoogleDebugAndroidTestKotlin
          :app:compileGoogleDebugAndroidTestJavaWithJavac

      # Phone-installable arm64 APK for main only (not every PR). -Parm64Apk
      # builds a single ABI split (~57MB) instead of the fat -Pci APK.
      - name: Assemble googleDebug arm64 APK
        if: github.event_name != 'pull_request'
        run: >
          ./gradlew --no-configuration-cache -Parm64Apk
          :app:assembleGoogleDebug

      - name: Upload googleDebug arm64 APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: dreamdroid-google-debug-apk
          path: app/build/outputs/apk/google/debug/app-google-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 2

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testGoogleDebugUnitTest/
            app/build/test-results/testGoogleDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

  # Emulator jobs are free on this public repo but slow (~20–40+ min) and flaky.
  # Keep them off pull_request; run on main pushes and manual workflow_dispatch.
  androidTest:
    name: Instrumented Compose tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: "25"
          distribution: temurin

      - name: Ensure Android SDK platforms
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [[ -z "$SDK" || ! -d "$SDK" ]]; then
            echo "ANDROID_HOME/SDK root missing" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n1 || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager not found under $SDK/cmdline-tools" >&2
            ls -la "$SDK" >&2 || true
            exit 1
          fi
          # Image has 34+; AGP still auto-fetches platform 33 mid-build and leaves
          # $SDK/.temp/PackageOperation* fingerprints that poison config-cache.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-33" "platforms;android-34" "build-tools;36.0.0"
          rm -rf "$SDK/.temp"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Instrumented tests (googleDebug)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          disable-animations: true
          # -Pci disables ABI splits so connectedAndroidTest installs one APK.
          # Do not pass -Pandroid.testInstrumentationRunnerArguments… (breaks flavors).
          script: ./gradlew -Pci --no-configuration-cache :app:connectedGoogleDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: androidTest-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
