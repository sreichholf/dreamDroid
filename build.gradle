buildscript {
    repositories {
        mavenCentral()
        google()
    }
    // AGP 9 ships built-in Kotlin (KGP >= 2.2.10). Compose BOM 2026.09.00
    // is used with Kotlin 2.4.x; put a matching KGP on the classpath so
    // AGP upgrades its bundled compiler (do not apply kotlin-android).
    ext.kotlin_version = '2.4.20'
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

plugins {
    id 'com.diffplug.spotless' version '8.10.2'
}

// Google’s Android Kotlin style guide via ktlint `android_studio`.
// https://developer.android.com/kotlin/style-guide
// https://ktlint.github.io/ktlint/latest/rules/code-styles/
spotless {
    kotlin {
        target 'app/**/*.kt'
        targetExclude '**/build/**'
        ktlint('1.8.0')
        trimTrailingWhitespace()
        endWithNewline()
    }
}

allprojects {
    tasks.withType(Test).configureEach {
     forkEvery = 100
    }
}
