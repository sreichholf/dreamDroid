buildscript {
    repositories {
        mavenCentral()
        flatDir{
            dirs 'libs'
        }
        google()
        gradlePluginPortal()
    }
    ext.kotlin_version = rootProject.ext.kotlin_version
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.2.10-2.0.2"
    }
}
apply plugin: 'com.android.application'
// AGP 9: Kotlin is built-in. Compose needs the Compose compiler Gradle plugin.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// Room needs KSP for Kotlin @Database / @Entity (Java annotationProcessor is not enough).
apply plugin: 'com.google.devtools.ksp'

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    //noinspection KtxExtensionAvailable
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    // Phase 3.1c-iv: Compose for TV hub. Leanback kept for VideoOverlay HorizontalGridView.
    implementation 'androidx.tv:tv-foundation:1.0.0-alpha11'
    implementation 'androidx.tv:tv-material:1.0.0'
    implementation 'androidx.annotation:annotation:1.5.0'
    //noinspection KtxExtensionAvailable
    implementation 'androidx.fragment:fragment:1.5.5'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'org.videolan.android:libvlc-all:3.7.5'
    implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'
    implementation 'com.github.StephenVinouze:MaterialNumberPicker:1.0.5'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'commons-net:commons-net:3.6'
    implementation 'commons-io:commons-io:2.6'
    implementation 'org.jmdns:jmdns:3.5.9'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation project(':libraries:AttributionPresenter:library')
    implementation project(':libraries:simple-gauge-android:gaugelibrary')
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'androidx.slidingpanelayout:slidingpanelayout:1.2.0'

    def composeBom = platform('androidx.compose:compose-bom:2024.04.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose'
    implementation 'androidx.navigation:navigation-compose:2.7.7'
    // Phase 2.6e: Glance chassis for Virtual Remote (dense RCU stays RemoteViews via AndroidRemoteViews).
    implementation 'androidx.glance:glance-appwidget:1.1.1'
    implementation 'androidx.glance:glance-material3:1.1.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    testImplementation 'junit:junit:4.13.2'
}

android {
    namespace = "net.reichholf.dreamdroid"
    compileSdk Integer.parseInt(project.COMPILE_SDK_VERSION)

    defaultConfig {
        versionCode 460
        versionName="1.15.460"
        minSdkVersion 26
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "int", "MIN_SDK", "${minSdkVersion.apiLevel}"
        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
                java {
                    srcDirs = ['src']
                    exclude 'test/**'
                    exclude 'androidTest/**'
                }
                // AGP 9 built-in Kotlin does not compile .kt from java srcDirs.
                kotlin {
                    srcDirs = ['src']
                    exclude 'test/**'
                    exclude 'androidTest/**'
                }
                res.srcDirs = ['res']
            }
            test {
                java.srcDirs = ['src/test/java']
                kotlin.srcDirs = ['src/test/java']
                resources.srcDirs = ['src/test/resources']
            }
            androidTest {
                java.srcDirs = ['androidTest/java']
                // Prefer new tests under androidTest/kotlin; keep java/ until migrated.
                kotlin.srcDirs = ['androidTest/kotlin', 'androidTest/java']
                res.srcDirs = ['androidTest/res']
            }
        }
    }
    // Shared debug cert (repo-root debug.keystore) so CI, Cloud, and local
    // googleDebug APKs are interchangeable. AGP's default is ~/.android/debug.keystore.
    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    flavorDimensions "distribution"
    productFlavors {
        google {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid"
        }
        fdroid {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid"
        }
        amazon {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid.amazon"
        }
    }
    splits {
        abi {
            // -Pci: one fat APK (unit/androidTest jobs).
            // -Parm64Apk: ABI-split arm64-only (CI artifact upload).
            enable project.hasProperty("arm64Apk") || !project.hasProperty("ci")
            reset()
            if (project.hasProperty("arm64Apk")) {
                include 'arm64-v8a'
                universalApk false
            } else {
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    // ABI versionCode overrides moved to androidComponents (AGP 9 removed applicationVariants).

    buildTypes {
        debug {
            buildConfigField "long", "BUILD_TIME", "0L"
            applicationIdSuffix '.debug'
            versionNameSuffix "-debug"
            resValue "string", "app_name", "@string/app_name_debug"
            resValue "string", "app_name_tv", "@string/app_name_tv_debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            buildConfigField "long", "BUILD_TIME", "" + System.currentTimeMillis() + "L"
            resValue "string", "app_name", "@string/app_name_release"
            resValue "string", "app_name_tv", "@string/app_name_tv_release"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        compose true
        // AGP 9 defaults resValues to false; debug/release use resValue.
        resValues true
    }
}

// ABI versionCode overrides via the AGP 9 Variant API.
ext.abiVersionCodes = ['armeabi': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'mips': 5, 'mips64': 6, 'x86': 8, 'x86_64': 9]
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiFilter = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }
            def abiCode = project.ext.abiVersionCodes.get(abiFilter?.identifier, 99)
            def base = output.versionCode.orNull ?: android.defaultConfig.versionCode
            output.versionCode.set(abiCode * 10000000 + base)
        }
    }
}
