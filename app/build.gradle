buildscript {
    repositories {
        mavenCentral()
        flatDir{
            dirs 'libs'
        }
        google()
        gradlePluginPortal()
    }
    ext.kotlin_version = rootProject.ext.kotlin_version
    dependencies {
        classpath 'com.android.tools.build:gradle:9.4.0'
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin:2.3.12"
    }
}
apply plugin: 'com.android.application'
// AGP 9: Kotlin is built-in. Compose needs the Compose compiler Gradle plugin.
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
// Room needs KSP for Kotlin @Database / @Entity (Java annotationProcessor is not enough).
apply plugin: 'com.google.devtools.ksp'

repositories {
    google()
    mavenCentral()
}

dependencies {
    def room_version = "3.0.3"
    implementation "androidx.room3:room3-runtime:$room_version"
    ksp "androidx.room3:room3-compiler:$room_version"
    implementation "androidx.sqlite:sqlite-bundled:2.7.1"

    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.leanback:leanback:1.2.0'
    // Leanback kept for VideoOverlay HorizontalGridView only.
    implementation 'androidx.tv:tv-material:1.1.0'
    implementation 'androidx.annotation:annotation:1.10.0'
    implementation 'androidx.fragment:fragment-ktx:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'org.videolan.android:libvlc-all:3.7.5'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"
    implementation 'io.coil-kt.coil3:coil:3.6.2'
    implementation 'io.coil-kt.coil3:coil-compose:3.6.2'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.6.2'
    implementation 'commons-net:commons-net:3.13.0'
    implementation 'org.jmdns:jmdns:3.6.3'
    implementation 'com.google.code.gson:gson:2.14.0'

    def composeBom = platform('androidx.compose:compose-bom:2026.09.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.navigation:navigation-compose:2.10.1'
    // Phase 2.6e: Glance chassis for Virtual Remote (dense RCU stays RemoteViews via AndroidRemoteViews).
    implementation 'androidx.glance:glance-appwidget:1.2.0'
    implementation 'androidx.glance:glance-material3:1.2.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:5.5.0'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

android {
    namespace = "net.reichholf.dreamdroid"
    compileSdk Integer.parseInt(project.COMPILE_SDK_VERSION)

    defaultConfig {
        versionCode 462
        versionName="2.0.462"
        minSdkVersion 26
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "int", "MIN_SDK", "${minSdkVersion.apiLevel}"
        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
                java {
                    srcDirs = ['src']
                    exclude 'test/**'
                    exclude 'androidTest/**'
                }
                // AGP 9 built-in Kotlin does not compile .kt from java srcDirs.
                kotlin {
                    srcDirs = ['src']
                    exclude 'test/**'
                    exclude 'androidTest/**'
                }
                res.srcDirs = ['res']
            }
            androidTest {
                java.srcDirs = ['androidTest/java']
                // Instrumented tests live in androidTest/java (AGENTS.md).
                kotlin.srcDirs = ['androidTest/java']
                res.srcDirs = ['androidTest/res']
                resources.srcDirs = ['androidTest/resources']
            }
            test {
                java.srcDirs = ['test/java']
                kotlin.srcDirs = ['test/java']
                resources.srcDirs = ['test/resources']
            }
        }
    }
    // Shared debug cert (repo-root debug.keystore) so CI, Cloud, and local
    // googleDebug APKs are interchangeable. AGP's default is ~/.android/debug.keystore.
    signingConfigs {
        debug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }
    flavorDimensions "distribution"
    productFlavors {
        google {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid"
        }
        fdroid {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid"
        }
        amazon {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid.amazon"
        }
    }
    splits {
        abi {
            // -Pci: one fat APK (unit/androidTest jobs).
            // -Parm64Apk: ABI-split arm64-only (CI artifact upload).
            enable project.hasProperty("arm64Apk") || !project.hasProperty("ci")
            reset()
            if (project.hasProperty("arm64Apk")) {
                include 'arm64-v8a'
                universalApk false
            } else {
                include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
                universalApk true
            }
        }
    }

    // ABI versionCode overrides moved to androidComponents (AGP 9 removed applicationVariants).

    buildTypes {
        debug {
            buildConfigField "long", "BUILD_TIME", "0L"
            applicationIdSuffix '.debug'
            versionNameSuffix "-debug"
            resValue "string", "app_name", "@string/app_name_debug"
            resValue "string", "app_name_tv", "@string/app_name_tv_debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            buildConfigField "long", "BUILD_TIME", "" + System.currentTimeMillis() + "L"
            resValue "string", "app_name", "@string/app_name_release"
            resValue "string", "app_name_tv", "@string/app_name_tv_release"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    testOptions {
        unitTests.all {
            useJUnitPlatform()
        }
    }
    buildFeatures {
        buildConfig true
        compose true
        // AGP 9 defaults resValues to false; debug/release use resValue.
        resValues true
    }
}

// ABI versionCode overrides via the AGP 9 Variant API.
ext.abiVersionCodes = ['armeabi': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'mips': 5, 'mips64': 6, 'x86': 8, 'x86_64': 9]
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            def abiFilter = output.filters.find {
                it.filterType == com.android.build.api.variant.FilterConfiguration.FilterType.ABI
            }
            def abiCode = project.ext.abiVersionCodes.get(abiFilter?.identifier, 99)
            def base = output.versionCode.orNull ?: android.defaultConfig.versionCode
            output.versionCode.set(abiCode * 10000000 + base)
        }
    }
}
