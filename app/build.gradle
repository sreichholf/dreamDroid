buildscript {
    repositories {
        mavenCentral()
        flatDir{
            dirs 'libs'
        }
        google()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.0'
    }
    ext.kotlin_version = '1.9.24'
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }

}
apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

repositories {
    google()
    mavenCentral()
    maven { url "https://jitpack.io" }
}

dependencies {
    def room_version = "2.5.0"
    implementation "androidx.room:room-runtime:$room_version"
    annotationProcessor "androidx.room:room-compiler:$room_version"

    //noinspection KtxExtensionAvailable
    implementation 'androidx.preference:preference:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.leanback:leanback:1.0.0'
    implementation 'androidx.leanback:leanback-preference:1.0.0'
    implementation 'androidx.annotation:annotation:1.5.0'
    //noinspection KtxExtensionAvailable
    implementation 'androidx.fragment:fragment:1.5.5'
    implementation 'com.google.android.material:material:1.8.0'
    implementation 'org.videolan.android:libvlc-all:3.5.1'
    implementation 'com.simplecityapps:recyclerview-fastscroll:2.0.1'
    implementation 'com.github.StephenVinouze:MaterialNumberPicker:1.0.5'
    implementation 'com.github.chrisbanes:PhotoView:2.3.0'
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'commons-net:commons-net:3.6'
    implementation 'commons-io:commons-io:2.6'
    implementation 'org.jmdns:jmdns:3.5.9'
    implementation 'io.noties.markwon:core:4.6.2'
    implementation project(':libraries:AttributionPresenter:library')
    implementation project(':libraries:simple-gauge-android:gaugelibrary')
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.evernote:android-state:1.4.1'
    annotationProcessor 'com.evernote:android-state-processor:1.4.1'
    implementation 'com.github.livefront:bridge:v2.0.2'
    implementation 'com.jakewharton:butterknife:10.2.0'
    annotationProcessor 'com.jakewharton:butterknife-compiler:10.2.0'
    implementation 'androidx.slidingpanelayout:slidingpanelayout:1.2.0'

    def composeBom = platform('androidx.compose:compose-bom:2024.04.01')
    implementation composeBom
    androidTestImplementation composeBom
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test:rules:1.5.0'
    testImplementation 'junit:junit:4.13.2'
}

configurations.configureEach { cfg ->
    if (cfg.name.startsWith("kotlinCompilerPluginClasspath") && !cfg.name.contains("Native")) {
        project.dependencies.add(cfg.name, "androidx.compose.compiler:compiler:1.5.14")
    }
}

android {
    namespace = "net.reichholf.dreamdroid"
    compileSdk Integer.parseInt(project.COMPILE_SDK_VERSION)

    defaultConfig {
        versionCode 460
        versionName="1.15.460"
        minSdkVersion 26
        targetSdkVersion 34
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        buildConfigField "int", "MIN_SDK", "${minSdkVersion.apiLevel}"
        sourceSets {
            main {
                manifest.srcFile 'AndroidManifest.xml'
                java {
                    srcDirs = ['src']
                    exclude 'test/**'
                    exclude 'androidTest/**'
                }
                res.srcDirs = ['res']
            }
            test {
                java.srcDirs = ['src/test/java']
                resources.srcDirs = ['src/test/resources']
            }
            androidTest {
                java.srcDirs = ['androidTest/java']
                res.srcDirs = ['androidTest/res']
            }
        }
    }
    flavorDimensions "distribution"
    productFlavors {
        google {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid"
        }
        fdroid {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid"
        }
        amazon {
            dimension "distribution"
            applicationId "net.reichholf.dreamdroid.amazon"
        }
    }
    splits {
        abi {
            // CI passes -Pci so connectedGoogleDebugAndroidTest installs one APK.
            enable !project.hasProperty("ci")
            reset()
            include 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }

    project.ext.versionCodes = ['armeabi': 1, 'armeabi-v7a': 2, 'arm64-v8a': 3, 'mips': 5, 'mips64': 6, 'x86': 8, 'x86_64': 9]

    android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride =
                    project.ext.versionCodes.get(output.getFilter(
                            com.android.build.OutputFile.ABI), 99) * 10000000 + android.defaultConfig.versionCode
        }
    }

    buildTypes {
        debug {
            buildConfigField "long", "BUILD_TIME", "0L"
            applicationIdSuffix '.debug'
            versionNameSuffix "-debug"
            resValue "string", "app_name", "@string/app_name_debug"
            resValue "string", "app_name_tv", "@string/app_name_tv_debug"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false
            buildConfigField "long", "BUILD_TIME", "" + System.currentTimeMillis() + "L"
            resValue "string", "app_name", "@string/app_name_release"
            resValue "string", "app_name_tv", "@string/app_name_tv_release"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
    lint {
        abortOnError false
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
}
